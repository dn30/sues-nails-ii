<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sue's Nails — Booking Admin</title>
<style>
:root{--ink:#262016;--soft:#57503f;--muted:#8a8171;--gold:#a8842c;--gold-dark:#8c6d20;--hairline:rgba(168,132,44,.28);--cream:#faf6ef;--white:#fff;--green:#2e7d4f;--red:#a33}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5;padding:1.5rem}
h1{font-size:1.3rem;margin:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.account{display:flex;align-items:center;gap:.65rem}
.whoami{font-size:.85rem;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.logout{text-decoration:none;min-height:36px;padding:.35rem .9rem;display:inline-flex;align-items:center}
h2{font-size:1.05rem;margin:1.5rem 0 .75rem}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem}
.tabs button{font:inherit;border:1px solid var(--hairline);background:var(--white);border-radius:999px;padding:.45rem 1.1rem;cursor:pointer}
.tabs button.active{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.panel{background:var(--white);border:1px solid var(--hairline);border-radius:8px;padding:1.25rem;max-width:1080px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--hairline);vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
input,select,textarea{font:inherit;padding:.45rem .6rem;border:1px solid var(--hairline);border-radius:6px;background:var(--white);color:var(--ink);max-width:100%}
button.btn,a.btn{font:inherit;border:none;background:var(--ink);color:var(--cream);border-radius:999px;padding:.45rem 1.1rem;cursor:pointer}
button.btn:hover,a.btn:hover{background:var(--gold-dark)}
button.btn.secondary,a.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--ink)}
button.btn.danger,a.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:end;margin-bottom:1rem}
.row label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.2rem}
.cancelled{opacity:.5;text-decoration:line-through}
.pill{display:inline-block;border-radius:999px;padding:.1rem .6rem;font-size:.75rem;background:rgba(46,125,79,.12);color:var(--green)}
.pill.off{background:rgba(170,51,51,.1);color:var(--red)}
.msg{margin:.75rem 0;font-size:.9rem;color:var(--green)}
.msg.err{color:var(--red)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
small.hint{color:var(--muted)}
.day-group{margin:1.5rem 0 0}
.day-group:first-child{margin-top:.25rem}
.day-heading{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:2px solid var(--ink);margin-bottom:.35rem}
.day-heading h3{font-size:1.05rem;font-weight:700}
.day-heading .count{font-size:.8rem;color:var(--muted);font-weight:500}
a.tel{color:var(--gold-dark);text-decoration:none}
a.tel:active{opacity:.7}

/* Collapsible "Add a booking" panel */
.add-booking{border:1px solid var(--hairline);border-radius:10px;background:#fdfbf5;margin-bottom:0}
.add-booking summary{list-style:none;cursor:pointer;padding:.8rem 1rem;font-weight:600;display:flex;align-items:center;gap:.6rem;-webkit-tap-highlight-color:transparent;user-select:none}
.add-booking summary::-webkit-details-marker{display:none}
.add-booking summary::before{content:"+";display:inline-flex;align-items:center;justify-content:center;width:1.45rem;height:1.45rem;border-radius:50%;background:var(--ink);color:var(--cream);font-size:1.05rem;line-height:1;flex:0 0 auto}
.add-booking[open] summary::before{content:"–"}
.add-booking form{padding:.15rem 1rem 1rem}
.schedule-section{margin-top:1.5rem;padding-top:1.25rem;border-top:2px solid var(--ink)}
.schedule-section>h2{margin:0 0 .35rem;font-size:1.05rem}
.schedule-lead{margin:0 0 1rem;font-size:.88rem;color:var(--muted)}

/* Booking cards (readable on phone; table only on wide screens) */
.booking-card{border:1px solid var(--hairline);border-radius:10px;padding:.85rem 1rem;margin:.65rem 0;background:var(--white);box-shadow:0 1px 3px rgba(38,32,22,.06)}
.booking-card.is-cancelled{opacity:.55}
.booking-card.is-cancelled .bc-name,.booking-card.is-cancelled .bc-time{text-decoration:line-through}
.bc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;margin-bottom:.45rem}
.bc-time{font-size:1.15rem;font-weight:700;line-height:1.2}
.bc-service{font-size:.95rem;margin-top:.1rem}
.bc-code{display:block;margin-top:.1rem}
.bc-meta{display:grid;gap:.35rem;margin:.55rem 0 .7rem}
.bc-row{display:grid;grid-template-columns:76px 1fr;gap:.5rem;align-items:center;font-size:.92rem}
.bc-row>span:first-child{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.bc-name{font-weight:600}
.bc-row select{width:100%;min-width:0}
.bc-actions{margin-top:.15rem}
.bc-actions .btn{width:100%}
.desktop-table{display:none}

/* Hours & closures */
.day-badge{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--hairline);border-radius:999px;padding:.1rem .5rem;white-space:nowrap}
.day-badge.off{color:var(--red);border-color:rgba(170,51,51,.35);background:rgba(170,51,51,.06)}
.day-badge.on{color:var(--green);border-color:rgba(46,125,79,.35);background:rgba(46,125,79,.08)}
.hours-list{display:flex;flex-direction:column;gap:.5rem;margin:.75rem 0 1rem}
.day-item{border:1px solid var(--hairline);border-radius:10px;background:var(--white);overflow:hidden}
.day-item.is-closed-day{background:#f7f3ea}
.day-summary{display:flex;align-items:center;gap:.65rem;width:100%;padding:.75rem .85rem;border:none;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.day-summary .day-name{font-weight:600;flex:0 0 auto}
.day-summary .day-hours{flex:1;min-width:0;font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-body{display:none;padding:0 .85rem .85rem;border-top:1px solid var(--hairline)}
.day-item.is-open .day-body{display:block}
.day-item.is-open .svc-chevron{transform:rotate(90deg)}
.day-details{padding:.75rem 0;display:grid;gap:.4rem;font-size:.92rem}
.day-details .line{display:grid;grid-template-columns:5.5rem 1fr;gap:.5rem}
.day-details .svc-detail-label{padding-top:.1rem}
.day-seats{display:flex;align-items:center;gap:.4rem;margin:.5rem 0}
.day-seats label{margin:0;font-size:.66rem}
.day-seats input{width:5.75rem;min-height:40px;padding:.3rem .45rem}
.win-list{display:flex;flex-direction:column;gap:.4rem}
.win-row{display:flex;align-items:center;gap:.4rem}
.win-row input[type=time]{flex:1;min-width:0;min-height:40px}
.win-row .dash{color:var(--muted);flex:0 0 auto}
.win-row .btn-icon{flex:0 0 auto;width:2.4rem;min-height:40px;padding:0;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
.hours-save{position:sticky;bottom:.75rem;z-index:3;width:100%;margin-top:.5rem;box-shadow:0 4px 16px rgba(38,32,22,.18)}
.closure-list{display:flex;flex-direction:column;gap:.45rem;margin:.75rem 0}
.closure-card{display:flex;align-items:center;justify-content:space-between;gap:.75rem;border:1px solid var(--hairline);border-radius:10px;padding:.65rem .85rem;background:var(--white)}
.closure-card .when{font-weight:600}
.closure-card .btn{flex:0 0 auto;min-height:36px;padding:.35rem .9rem;width:auto}

/* Services list */
.svc-list{display:flex;flex-direction:column;gap:.5rem;margin-top:.75rem}
.svc-item{border:1px solid var(--hairline);border-radius:10px;background:var(--white);overflow:hidden}
.svc-item.is-inactive{opacity:.65}
.svc-summary{display:flex;align-items:center;gap:.75rem;width:100%;padding:.75rem .85rem;border:none;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.svc-num{flex:0 0 1.75rem;width:1.75rem;height:1.75rem;border-radius:50%;background:var(--cream);border:1px solid var(--hairline);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--soft)}
.svc-name{flex:1;min-width:0;font-weight:600;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svc-meta{flex:0 0 auto;font-size:.8rem;color:var(--muted);white-space:nowrap}
.svc-chevron{flex:0 0 auto;color:var(--muted);font-size:.85rem;transition:transform .15s ease}
.svc-item.is-open .svc-chevron{transform:rotate(90deg)}
.svc-body{display:none;padding:0 .85rem .85rem;border-top:1px solid var(--hairline)}
.svc-item.is-open .svc-body{display:block}
.svc-details{display:grid;gap:.35rem;padding:.75rem 0;font-size:.92rem}
.svc-details div{display:grid;grid-template-columns:7.5rem 1fr;gap:.5rem}
.svc-details dt,.svc-detail-label{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding-top:.15rem}
.svc-actions{display:flex;gap:.5rem;flex-wrap:wrap}
.svc-actions .btn{flex:1;min-width:7rem}
.svc-form .row{margin-bottom:.65rem}
.add-service{margin-bottom:.25rem}
.staff-list{display:flex;flex-direction:column;gap:.45rem;margin-top:.75rem}
.staff-row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;border:1px solid var(--hairline);border-radius:10px;padding:.65rem .85rem;background:var(--white)}
.staff-row .name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.staff-row .btn{flex:0 0 auto;min-height:36px;padding:.35rem .9rem;width:auto}

/* Tip: tap/hover "?" next to a label — bubble anchors to the field, not the icon */
.grid2>div,.field-tip{position:relative}
.tip{display:inline-flex;align-items:center;margin-left:.35rem;vertical-align:middle}
.tip>button{appearance:none;-webkit-appearance:none;border:1px solid var(--hairline);background:var(--cream);color:var(--soft);width:1.35rem;height:1.35rem;border-radius:50%;font:600 .72rem/1 system-ui,sans-serif;padding:0;cursor:help}
.tip>button:focus{outline:2px solid var(--gold);outline-offset:1px}
.tip .tip-bubble{display:none;position:absolute;left:0;right:0;top:1.85rem;z-index:6;width:auto;max-width:none;padding:.65rem .75rem;border-radius:8px;background:var(--ink);color:var(--cream);font-size:.8rem;font-weight:400;line-height:1.35;letter-spacing:0;text-transform:none;box-shadow:0 6px 18px rgba(38,32,22,.22)}
.tip .tip-bubble::before{content:"";position:absolute;left:1rem;top:-5px;border:5px solid transparent;border-top:0;border-bottom-color:var(--ink)}
.tip:hover .tip-bubble,.tip:focus-within .tip-bubble,.tip.is-open .tip-bubble{display:block}
label{overflow:visible}

/* ---- Mobile ---- */
@media (max-width: 720px) {
  body{padding:.75rem}
  h1{font-size:1.05rem}
  .topbar{margin-bottom:.75rem}
  .whoami{max-width:140px}
  .panel{padding:1rem .8rem}
  /* Tabs: one scrollable line */
  .tabs{flex-wrap:nowrap;overflow-x:auto;margin:0 -.75rem 1rem;padding:0 .75rem .35rem;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;padding:.55rem 1.1rem}
  /* Comfortable tap targets; 16px stops iOS focus zoom */
  input:not([type=checkbox]),select,textarea{font-size:16px;min-height:44px}
  input[type=checkbox]{width:1.15rem;height:1.15rem}
  button.btn{min-height:44px;padding:.55rem 1.2rem}
  /* Form rows become stacked, full-width fields */
  .row{flex-direction:column;align-items:stretch;gap:.65rem}
  .row>div>input,.row>div>select{width:100% !important}
  .row>button{width:100%}
  .day-heading{position:sticky;top:0;background:var(--white);z-index:2;padding:.35rem 0}
}

@media (min-width: 721px) {
  .booking-cards{display:none}
  .desktop-table{display:table}
  .bc-actions .btn{width:auto}
}
</style>
</head>
<body>
<header class="topbar">
  <h1>Sue&rsquo;s Nails — Booking Admin</h1>
  <div class="account">
    <span id="whoami" class="whoami"></span>
    <a class="btn secondary logout" href="/admin/logout">Sign out</a>
  </div>
</header>
<div class="tabs">
  <button data-tab="bookings" class="active">Bookings</button>
  <button data-tab="services">Services</button>
  <button data-tab="staff">Staff</button>
  <button data-tab="hours">Hours &amp; Closures</button>
  <button data-tab="team">Team</button>
  <button data-tab="settings">Settings</button>
</div>
<div id="app" class="panel">Loading…</div>

<script>
"use strict";
const app = document.getElementById("app");
let SETTINGS = null;
let STAFF = [];

function api(path, opts) {
  return fetch(path, opts).then(async (r) => {
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
    return data;
  });
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function minToTime(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
}
function timeToMin(t) {
  const [h, m] = (t || "0:0").split(":").map(Number);
  return h * 60 + m;
}
function fmtMin(min) {
  const h = Math.floor(min / 60), m = min % 60;
  const ampm = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 || 12;
  return h12 + ":" + String(m).padStart(2, "0") + " " + ampm;
}
function staffList() {
  return STAFF.map((s) => s.name);
}
async function refreshStaff() {
  const data = await api("/api/admin/staff");
  STAFF = data.staff;
}
function showMsg(text, isErr) {
  const box = document.getElementById("msg");
  if (!box) return alert(text);
  box.textContent = text;
  box.className = "msg" + (isErr ? " err" : "");
  setTimeout(() => { if (box.textContent === text) box.textContent = ""; }, 4000);
}
function longDate(ymd) {
  // Parse as local calendar date so the weekday matches the salon-local booking day.
  const [y, m, d] = ymd.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
  const label = date.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  if (date.getTime() === today.getTime()) return "Today — " + label;
  if (date.getTime() === tomorrow.getTime()) return "Tomorrow — " + label;
  return label;
}

/* ---------- Bookings ---------- */
async function viewBookings() {
  await refreshStaff();
  const services = (await api("/api/admin/services")).services;
  const today = new Date().toISOString().slice(0, 10);
  const in14 = new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10);
  app.innerHTML = `
    <details class="add-booking" id="add-wrap">
    <summary>Add a booking</summary>
    <form id="add-form">
      <div class="row">
        <div><label>Service</label><select id="ab-service">
          ${services.map((s) => `<option value="${s.id}">${esc(s.name)}${s.active === 0 ? " (inactive)" : ""}</option>`).join("")}
        </select></div>
        <div><label>Date</label><input type="date" id="ab-date" value="${today}" required></div>
        <div><label>Time</label><select id="ab-time"></select></div>
        <div id="ab-custom-wrap" style="display:none"><label>Custom time</label><input type="time" id="ab-custom"></div>
        <div><label>Party</label><input type="number" id="ab-party" value="1" min="1" max="50" style="width:70px"></div>
      </div>
      <div class="row">
        <div><label>Customer name</label><input id="ab-name" required placeholder="e.g. Maria"></div>
        <div><label>Phone</label><input id="ab-phone" type="tel" placeholder="optional" style="width:130px"></div>
        <div><label>Email</label><input id="ab-email" type="email" placeholder="optional" style="width:160px"></div>
        <div><label>Assigned to</label><select id="ab-staff">
          <option value="">— unassigned —</option>
          ${staffList().map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join("")}
        </select></div>
        <div><label>Notes</label><input id="ab-notes" style="width:170px"></div>
        <div><label>&nbsp;</label><label><input type="checkbox" id="ab-force" style="width:auto"> book anyway (full or closed)</label></div>
        <button class="btn" type="submit">Add booking</button>
      </div>
    </form>
    </details>
    <section class="schedule-section" aria-labelledby="schedule-heading">
      <h2 id="schedule-heading">View schedule</h2>
      <p class="schedule-lead">Filter the appointments already on the books. This does not create a booking.</p>
      <div class="row">
        <div><label>From</label><input type="date" id="from" value="${today}"></div>
        <div><label>To</label><input type="date" id="to" value="${in14}"></div>
        <div><label>&nbsp;</label><label><input type="checkbox" id="inc-cancelled" style="width:auto"> show cancelled</label></div>
        <button class="btn" id="reload">Refresh</button>
      </div>
      <div id="msg" class="msg"></div>
      <div id="list">Loading…</div>
    </section>`;
  document.getElementById("reload").onclick = loadBookings;
  document.getElementById("inc-cancelled").onchange = loadBookings;
  // Collapsed by default on phones so the day list is the first thing you see.
  if (window.matchMedia("(min-width: 721px)").matches) {
    document.getElementById("add-wrap").open = true;
  }

  const abService = document.getElementById("ab-service");
  const abDate = document.getElementById("ab-date");
  const abTime = document.getElementById("ab-time");
  const abCustomWrap = document.getElementById("ab-custom-wrap");

  async function loadSlots() {
    abTime.innerHTML = `<option value="">Loading…</option>`;
    try {
      const data = await api(`/api/admin/availability?service_id=${abService.value}&date=${abDate.value}`);
      const opts = data.slots.map((s) =>
        `<option value="${s.start_ts}">${esc(s.label)} (${s.remaining} left)</option>`).join("");
      abTime.innerHTML = (opts || `<option value="">— no open slots —</option>`) +
        `<option value="custom">Custom time…</option>`;
    } catch (e) {
      abTime.innerHTML = `<option value="custom">Custom time…</option>`;
      showMsg(e.message, true);
    }
    abCustomWrap.style.display = abTime.value === "custom" ? "" : "none";
  }
  abService.onchange = loadSlots;
  abDate.onchange = loadSlots;
  abTime.onchange = () => { abCustomWrap.style.display = abTime.value === "custom" ? "" : "none"; };
  await loadSlots();

  document.getElementById("add-form").onsubmit = async (e) => {
    e.preventDefault();
    const body = {
      service_id: parseInt(abService.value, 10),
      party_size: parseInt(document.getElementById("ab-party").value, 10) || 1,
      name: document.getElementById("ab-name").value.trim(),
      phone: document.getElementById("ab-phone").value.trim(),
      email: document.getElementById("ab-email").value.trim(),
      notes: document.getElementById("ab-notes").value.trim(),
      assigned_to: document.getElementById("ab-staff").value,
      force: document.getElementById("ab-force").checked,
    };
    if (abTime.value === "custom") {
      const t = document.getElementById("ab-custom").value;
      if (!t) return showMsg("Pick a custom time", true);
      body.date = abDate.value;
      body.time = t;
    } else if (abTime.value) {
      body.start_ts = parseInt(abTime.value, 10);
    } else {
      return showMsg("Pick a time (or use Custom time)", true);
    }
    try {
      const res = await api("/api/admin/bookings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      showMsg(`Booking added — ${res.booking.code} (${res.booking.date} ${res.booking.time})`);
      document.getElementById("ab-name").value = "";
      document.getElementById("ab-phone").value = "";
      document.getElementById("ab-email").value = "";
      document.getElementById("ab-notes").value = "";
      document.getElementById("ab-force").checked = false;
      await loadSlots();
      await loadBookings();
    } catch (err) { showMsg(err.message, true); }
  };

  await loadBookings();

  async function loadBookings() {
    const from = document.getElementById("from").value;
    const to = document.getElementById("to").value;
    const inc = document.getElementById("inc-cancelled").checked ? "&include_cancelled=1" : "";
    const list = document.getElementById("list");
    list.textContent = "Loading…";
    try {
      const data = await api(`/api/admin/bookings?from=${from}&to=${to}${inc}`);
      if (!data.bookings.length) { list.innerHTML = "<p>No bookings in this range.</p>"; return; }
      const staff = staffList();
      // Group by date (API already returns bookings ordered by start_ts).
      const byDate = new Map();
      for (const b of data.bookings) {
        if (!byDate.has(b.date)) byDate.set(b.date, []);
        byDate.get(b.date).push(b);
      }
      const assignSelect = (b) => `<select class="assign">
        <option value="">— unassigned —</option>
        ${staff.map((s) => `<option value="${esc(s)}" ${b.assigned_to === s ? "selected" : ""}>${esc(s)}</option>`).join("")}
        ${b.assigned_to && !staff.includes(b.assigned_to) ? `<option value="${esc(b.assigned_to)}" selected>${esc(b.assigned_to)}</option>` : ""}
      </select>`;
      const actionBtn = (b) => b.status === "confirmed"
        ? `<button class="btn danger cancel" type="button">Cancel</button>`
        : `<button class="btn secondary restore" type="button">Restore</button>`;
      const contactHtml = (b) => {
        const phone = b.customer_phone
          ? `<a class="tel" href="tel:${esc(b.customer_phone)}">${esc(b.customer_phone)}</a>` : "";
        const email = b.customer_email
          ? `<a class="tel" href="mailto:${esc(b.customer_email)}">${esc(b.customer_email)}</a>` : "";
        return [phone, email].filter(Boolean).join(" · ");
      };
      const cardHtml = (b) => {
        const contact = contactHtml(b);
        return `<article class="booking-card ${b.status === "cancelled" ? "is-cancelled" : ""}" data-id="${b.id}">
          <div class="bc-top">
            <div>
              <div class="bc-time">${esc(b.time)}</div>
              <div class="bc-service">${esc(b.service)} <small class="hint bc-code">${esc(b.code)}</small></div>
            </div>
            <span class="pill ${b.status === "cancelled" ? "off" : ""}">${esc(b.status)}</span>
          </div>
          <div class="bc-meta">
            <div class="bc-row"><span>Customer</span><div><span class="bc-name">${esc(b.customer_name)}</span>${contact ? `<br><small class="hint">${contact}</small>` : ""}${b.notes ? `<br><small class="hint">“${esc(b.notes)}”</small>` : ""}</div></div>
            <div class="bc-row"><span>Party</span><div>${b.party_size}</div></div>
            <div class="bc-row"><span>Assign</span><div>${assignSelect(b)}</div></div>
          </div>
          <div class="bc-actions">${actionBtn(b)}</div>
        </article>`;
      };
      const rowHtml = (b) => {
        const contact = contactHtml(b);
        return `<tr class="${b.status === "cancelled" ? "cancelled" : ""}" data-id="${b.id}">
          <td><strong>${esc(b.time)}</strong></td>
          <td>${esc(b.service)}<br><small class="hint">${esc(b.code)}</small></td>
          <td>${esc(b.customer_name)}${contact ? `<br><small class="hint">${contact}</small>` : ""}${b.notes ? `<br><small class="hint">“${esc(b.notes)}”</small>` : ""}</td>
          <td>${b.party_size}</td>
          <td>${assignSelect(b)}</td>
          <td><span class="pill ${b.status === "cancelled" ? "off" : ""}">${esc(b.status)}</span></td>
          <td>${actionBtn(b)}</td>
        </tr>`;
      };
      list.innerHTML = [...byDate.entries()].map(([date, bookings]) => {
        const n = bookings.length;
        return `<section class="day-group">
          <div class="day-heading">
            <h3>${esc(longDate(date))}</h3>
            <span class="count">${n} booking${n === 1 ? "" : "s"}</span>
          </div>
          <div class="booking-cards">${bookings.map(cardHtml).join("")}</div>
          <table class="desktop-table"><thead><tr>
            <th>Time</th><th>Service</th><th>Customer</th><th>Party</th><th>Assigned to</th><th>Status</th><th></th>
          </tr></thead><tbody>
            ${bookings.map(rowHtml).join("")}
          </tbody></table>
        </section>`;
      }).join("");

      list.querySelectorAll(".assign").forEach((sel) => {
        sel.onchange = async () => {
          const id = sel.closest("[data-id]").dataset.id;
          try { await api(`/api/admin/bookings/${id}`, patch({ assigned_to: sel.value })); showMsg("Assigned."); }
          catch (e) { showMsg(e.message, true); }
        };
      });
      list.querySelectorAll(".cancel").forEach((btn) => {
        btn.onclick = async () => {
          if (!confirm("Cancel this booking?")) return;
          const id = btn.closest("[data-id]").dataset.id;
          try { await api(`/api/admin/bookings/${id}`, patch({ status: "cancelled" })); loadBookings(); }
          catch (e) { showMsg(e.message, true); }
        };
      });
      list.querySelectorAll(".restore").forEach((btn) => {
        btn.onclick = async () => {
          const id = btn.closest("[data-id]").dataset.id;
          try { await api(`/api/admin/bookings/${id}`, patch({ status: "confirmed" })); loadBookings(); }
          catch (e) { showMsg(e.message, true); }
        };
      });
    } catch (e) {
      list.innerHTML = `<p class="msg err">${esc(e.message)}</p>`;
    }
  }
}
function patch(body) {
  return { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
}

/* ---------- Services ---------- */
function fmtPrice(cents) {
  if (cents == null) return "—";
  const n = Number(cents) / 100;
  return Number.isInteger(n) ? `$${n}` : `$${n.toFixed(2)}`;
}

async function viewServices() {
  app.innerHTML = `<div id="msg" class="msg"></div>
    <details class="add-booking add-service" id="add-svc">
      <summary>Add a service</summary>
      <div id="create"></div>
    </details>
    <div id="list">Loading…</div>`;
  document.getElementById("create").appendChild(serviceForm({}, async (body) => {
    await api("/api/admin/services", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    showMsg("Service created.");
    document.getElementById("add-svc").open = false;
    load();
  }));
  await load();

  async function load() {
    const list = document.getElementById("list");
    try {
      const data = await api("/api/admin/services");
      if (!data.services.length) {
        list.innerHTML = `<p><small class="hint">No services yet. Add one above.</small></p>`;
        return;
      }
      list.innerHTML = `<div class="svc-list">${data.services.map((s, idx) => {
        const n = idx + 1;
        const inactive = s.active === 0;
        return `<div class="svc-item ${inactive ? "is-inactive" : ""}" data-id="${s.id}">
          <button type="button" class="svc-summary" aria-expanded="false">
            <span class="svc-num">${n}</span>
            <span class="svc-name">${esc(s.name)}${inactive ? ` <span class="day-badge off">Inactive</span>` : ""}</span>
            <span class="svc-meta">${fmtPrice(s.price_cents)} · ${s.duration_min}m</span>
            <span class="svc-chevron" aria-hidden="true">›</span>
          </button>
          <div class="svc-body"></div>
        </div>`;
      }).join("")}</div>`;

      list.querySelectorAll(".svc-item").forEach((item) => {
        const s = data.services.find((x) => String(x.id) === item.dataset.id);
        const body = item.querySelector(".svc-body");
        const summary = item.querySelector(".svc-summary");
        summary.onclick = () => {
          const open = item.classList.toggle("is-open");
          summary.setAttribute("aria-expanded", open ? "true" : "false");
          if (open && !body.dataset.ready) {
            renderDetails(body, s, () => load());
            body.dataset.ready = "1";
          }
        };
      });
    } catch (e) { list.innerHTML = `<p class="msg err">${esc(e.message)}</p>`; }
  }
}

function renderDetails(body, s, onChanged) {
  body.innerHTML = "";
  const view = document.createElement("div");
  view.className = "svc-view";
  view.innerHTML = `
    <div class="svc-details">
      <div><span class="svc-detail-label">Description</span><span>${esc(s.description || "—")}</span></div>
      <div><span class="svc-detail-label">Price</span><span>${fmtPrice(s.price_cents)}</span></div>
      <div><span class="svc-detail-label">Duration</span><span>${s.duration_min} min</span></div>
      <div><span class="svc-detail-label">Buffer</span><span>${s.buffer_before_min || 0} before · ${s.buffer_after_min || 0} after</span></div>
      <div><span class="svc-detail-label">Sort order</span><span>${s.sort_order ?? 0}</span></div>
      <div><span class="svc-detail-label">Active</span><span>${s.active === 0 ? "No" : "Yes"}</span></div>
    </div>
    <div class="svc-actions">
      <button class="btn" type="button" data-edit>Edit</button>
      <button class="btn danger" type="button" data-del>Delete</button>
    </div>`;
  body.appendChild(view);

  view.querySelector("[data-edit]").onclick = () => {
    body.innerHTML = "";
    const formWrap = document.createElement("div");
    formWrap.className = "svc-form";
    const form = serviceForm(s, async (payload) => {
      await api(`/api/admin/services/${s.id}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      showMsg("Saved.");
      onChanged();
    }, async () => {
      if (!confirm(`Delete "${s.name}"? (Services with bookings are deactivated instead.)`)) return;
      await api(`/api/admin/services/${s.id}`, { method: "DELETE" });
      showMsg("Removed.");
      onChanged();
    });
    const cancel = document.createElement("button");
    cancel.type = "button";
    cancel.className = "btn secondary";
    cancel.textContent = "Cancel";
    cancel.onclick = () => { body.dataset.ready = ""; renderDetails(body, s, onChanged); body.dataset.ready = "1"; };
    form.appendChild(cancel);
    formWrap.appendChild(form);
    body.appendChild(formWrap);
  };
  view.querySelector("[data-del]").onclick = async () => {
    if (!confirm(`Delete "${s.name}"? (Services with bookings are deactivated instead.)`)) return;
    try {
      await api(`/api/admin/services/${s.id}`, { method: "DELETE" });
      showMsg("Removed.");
      onChanged();
    } catch (e) { showMsg(e.message, true); }
  };
}

function serviceForm(s, onSave, onDelete) {
  const f = document.createElement("form");
  f.className = "row";
  const priceVal = s.price_cents != null ? (s.price_cents / 100).toFixed(2).replace(/\.00$/, "") : "";
  f.innerHTML = `
    <div><label>Name</label><input name="name" required value="${esc(s.name || "")}"></div>
    <div><label>Description</label><input name="description" value="${esc(s.description || "")}"></div>
    <div><label>Price ($)</label><input name="price" type="number" min="0" step="0.01" value="${priceVal}"></div>
    <div><label>Duration (min)</label><input name="duration_min" type="number" min="5" max="480" required value="${s.duration_min || 30}"></div>
    <div><label>Buffer before</label><input name="buffer_before_min" type="number" min="0" value="${s.buffer_before_min || 0}"></div>
    <div><label>Buffer after</label><input name="buffer_after_min" type="number" min="0" value="${s.buffer_after_min || 0}"></div>
    <div><label>Order</label><input name="sort_order" type="number" value="${s.sort_order || 0}"></div>
    <div><label>Active</label><select name="active"><option value="1" ${s.active !== 0 ? "selected" : ""}>Yes</option><option value="0" ${s.active === 0 ? "selected" : ""}>No</option></select></div>
    <button class="btn" type="submit">${s.id ? "Save" : "Add"}</button>
    ${onDelete ? '<button class="btn danger" type="button" data-del>Delete</button>' : ""}`;
  f.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(f);
    const body = Object.fromEntries(fd.entries());
    body.active = parseInt(body.active, 10);
    try { await onSave(body); } catch (err) { showMsg(err.message, true); }
  };
  if (onDelete) f.querySelector("[data-del]").onclick = () => onDelete().catch((e) => showMsg(e.message, true));
  return f;
}

/* ---------- Hours & closures ---------- */
async function viewHours() {
  const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  app.innerHTML = `<div id="msg" class="msg"></div>
    <h2 style="margin-top:0">Weekly hours &amp; seats</h2>
    <p class="schedule-lead">Tap a day for details. Edit only when you need to change it. Remove all time windows to mark a day closed.</p>
    <div id="hours">Loading…</div>
    <h2>Closures (holidays)</h2>
    <div id="closures">Loading…</div>`;

  const data = await api("/api/admin/hours");
  let rows = data.hours.map((r) => ({ ...r }));
  let dayCap = { ...(data.day_capacity || {}) };
  let openDow = null;
  let editingDow = null;
  let snapshot = null;
  const hoursDiv = document.getElementById("hours");
  drawHours();

  function windowsFor(dow) {
    return rows.map((r, i) => ({ ...r, i })).filter((r) => r.dow === dow);
  }
  function hoursLabel(dow) {
    const wins = windowsFor(dow);
    if (!wins.length) return "Closed";
    return wins.map((w) => fmtMin(w.open_min) + "–" + fmtMin(w.close_min)).join(", ");
  }
  function seatsLabel(dow) {
    return dayCap[dow] != null ? dayCap[dow] + " seats" : "default seats";
  }

  function syncEditFromDom() {
    if (editingDow == null) return;
    hoursDiv.querySelectorAll(".win-row[data-i]").forEach((row) => {
      const i = +row.dataset.i;
      if (!rows[i] || rows[i].dow !== editingDow) return;
      rows[i].open_min = timeToMin(row.querySelector(".open").value);
      rows[i].close_min = timeToMin(row.querySelector(".close").value);
    });
    const cap = hoursDiv.querySelector(".daycap");
    if (cap) {
      if (cap.value) dayCap[editingDow] = parseInt(cap.value, 10);
      else delete dayCap[editingDow];
    }
  }

  async function saveHours() {
    syncEditFromDom();
    await api("/api/admin/hours", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ hours: rows, day_capacity: dayCap }),
    });
    showMsg("Hours & seats saved.");
    editingDow = null;
    snapshot = null;
    drawHours();
  }

  function drawHours() {
    hoursDiv.innerHTML = `<div class="hours-list">${DAYS.map((name, dow) => {
      const closed = windowsFor(dow).length === 0;
      const isOpen = openDow === dow;
      return `<div class="day-item ${closed ? "is-closed-day" : ""} ${isOpen ? "is-open" : ""}" data-dow="${dow}">
        <button type="button" class="day-summary" aria-expanded="${isOpen}">
          <span class="day-name">${name}</span>
          <span class="day-badge ${closed ? "off" : "on"}">${closed ? "Closed" : "Open"}</span>
          <span class="day-hours">${esc(hoursLabel(dow))} · ${esc(seatsLabel(dow))}</span>
          <span class="svc-chevron" aria-hidden="true">›</span>
        </button>
        <div class="day-body"></div>
      </div>`;
    }).join("")}</div>
    ${editingDow != null ? `<button class="btn hours-save" id="save-hours" type="button">Save changes</button>` : ""}`;

    hoursDiv.querySelectorAll(".day-item").forEach((item) => {
      const dow = +item.dataset.dow;
      const body = item.querySelector(".day-body");
      const summary = item.querySelector(".day-summary");
      if (openDow === dow) renderDayBody(body, dow);
      summary.onclick = () => {
        if (editingDow != null && editingDow !== dow) {
          if (!confirm("Discard unsaved edits for this day?")) return;
          rows = snapshot.rows.map((r) => ({ ...r }));
          dayCap = { ...snapshot.dayCap };
          editingDow = null;
          snapshot = null;
        }
        openDow = openDow === dow ? null : dow;
        drawHours();
      };
    });

    const saveBtn = document.getElementById("save-hours");
    if (saveBtn) saveBtn.onclick = () => saveHours().catch((e) => showMsg(e.message, true));
  }

  function renderDayBody(body, dow) {
    const name = DAYS[dow];
    const wins = windowsFor(dow);
    if (editingDow === dow) {
      body.innerHTML = `
        <div class="day-seats">
          <label>Seats</label>
          <input type="number" class="daycap" min="1" max="50" placeholder="default"
            value="${dayCap[dow] ?? ""}" inputmode="numeric">
        </div>
        <div class="win-list">
          ${wins.map((r) => `
            <div class="win-row" data-i="${r.i}">
              <input type="time" class="open" value="${minToTime(r.open_min)}" aria-label="${name} open">
              <span class="dash">–</span>
              <input type="time" class="close" value="${minToTime(r.close_min)}" aria-label="${name} close">
              <button class="btn danger btn-icon" type="button" data-rm="${r.i}" aria-label="Remove window">×</button>
            </div>`).join("") || `<p><small class="hint">No time windows — this day is closed.</small></p>`}
        </div>
        <div class="svc-actions" style="margin-top:.65rem">
          <button class="btn secondary" type="button" data-add>+ time window</button>
          <button class="btn" type="button" data-save>Save</button>
          <button class="btn secondary" type="button" data-cancel>Cancel</button>
        </div>`;
      body.querySelector("[data-add]").onclick = () => {
        syncEditFromDom();
        rows.push({ dow, open_min: 540, close_min: 1200 });
        drawHours();
      };
      body.querySelectorAll("[data-rm]").forEach((b) => {
        b.onclick = () => {
          syncEditFromDom();
          rows.splice(+b.dataset.rm, 1);
          drawHours();
        };
      });
      body.querySelector("[data-save]").onclick = () => saveHours().catch((e) => showMsg(e.message, true));
      body.querySelector("[data-cancel]").onclick = () => {
        rows = snapshot.rows.map((r) => ({ ...r }));
        dayCap = { ...snapshot.dayCap };
        editingDow = null;
        snapshot = null;
        drawHours();
      };
      return;
    }

    body.innerHTML = `
      <div class="day-details">
        <div class="line"><span class="svc-detail-label">Hours</span><span>${wins.length
          ? wins.map((w) => esc(fmtMin(w.open_min) + " – " + fmtMin(w.close_min))).join("<br>")
          : "Closed"}</span></div>
        <div class="line"><span class="svc-detail-label">Seats</span><span>${dayCap[dow] != null ? dayCap[dow] : "Default (from Settings)"}</span></div>
      </div>
      <div class="svc-actions">
        <button class="btn" type="button" data-edit>Edit</button>
      </div>`;
    body.querySelector("[data-edit]").onclick = () => {
      snapshot = { rows: rows.map((r) => ({ ...r })), dayCap: { ...dayCap } };
      editingDow = dow;
      openDow = dow;
      drawHours();
    };
  }

  await loadClosures();
  async function loadClosures() {
    const div = document.getElementById("closures");
    const data = await api("/api/admin/closures");
    const list = data.closures.length
      ? `<div class="closure-list">${data.closures.map((c) => `
          <div class="closure-card">
            <div>
              <div class="when">${esc(longDate(c.date))}</div>
              <small class="hint">${esc(c.reason || "Closed")}</small>
            </div>
            <button class="btn danger" type="button" data-date="${esc(c.date)}">Remove</button>
          </div>`).join("")}</div>`
      : `<p><small class="hint">No closures scheduled.</small></p>`;
    div.innerHTML = `
      <details class="add-booking add-service" id="add-closure">
        <summary>Add closure</summary>
        <form id="closure-form" class="row" style="margin:0">
          <div><label>Date</label><input type="date" id="cl-date" required></div>
          <div><label>Reason</label><input id="cl-reason" placeholder="e.g. Thanksgiving"></div>
          <button class="btn" type="submit">Add</button>
        </form>
      </details>
      ${list}`;
    div.querySelectorAll("[data-date]").forEach((b) => {
      b.onclick = async () => { await api(`/api/admin/closures/${b.dataset.date}`, { method: "DELETE" }); loadClosures(); };
    });
    document.getElementById("closure-form").onsubmit = async (e) => {
      e.preventDefault();
      const date = document.getElementById("cl-date").value;
      if (!date) return showMsg("Pick a date", true);
      try {
        await api("/api/admin/closures", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ date, reason: document.getElementById("cl-reason").value }) });
        document.getElementById("add-closure").open = false;
        loadClosures();
      } catch (err) { showMsg(err.message, true); }
    };
  }
}

            await api(`/api/admin/users/${id}`, patch({ status: "disabled" }));
            showMsg("User disabled.");
            load();
          } catch (e) { showMsg(e.message, true); }
        };
      });
      div.querySelectorAll("[data-enable]").forEach((b) => {
        b.onclick = async () => {
          const id = b.closest("[data-id]").dataset.id;
          try {
            await api(`/api/admin/users/${id}`, patch({ status: "invited" }));
            showMsg("User re-enabled as invited. They can sign in with Google again.");
            load();
          } catch (e) { showMsg(e.message, true); }
        };
      });
    } catch (e) { div.innerHTML = `<p class="msg err">${esc(e.message)}</p>`; }
  }

  document.getElementById("invite-form").onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById("invite-email").value.trim();
    const role = document.getElementById("invite-role").value;
    try {
      const res = await api("/api/admin/users/invite", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, role }),
      });
      document.getElementById("invite-email").value = "";
      document.getElementById("add-invite").open = false;
      showMsg(res.email_note || "Invite created.");
      load();
    } catch (err) { showMsg(err.message, true); }
  };
  await load();
}

/* ---------- Settings ---------- */
function tip(text) {
  return `<span class="tip"><button type="button" aria-label="More info">?</button><span class="tip-bubble" role="tooltip">${text}</span></span>`;
}

async function viewSettings() {
  const data = await api("/api/admin/settings");
  SETTINGS = data.settings;
  const s = data.settings;
  app.innerHTML = `<div id="msg" class="msg"></div>
    <form id="sform" class="grid2">
      <div><label>Default seats (max customers at once)${tip("How many customers can be served at the same time. Example: 3 means three appointments can overlap. Set to 1 for one customer at a time. You can override this per weekday under Hours &amp; Closures.")}</label><input name="capacity" type="number" min="1" max="50" value="${s.capacity}"></div>
      <div><label>Slot grid (minutes)${tip("How often new appointment start times appear. With 30, customers see 9:00, 9:30, 10:00, and so on. Smaller numbers give more choices but a busier calendar.")}</label><input name="slot_interval_min" type="number" min="5" max="120" value="${s.slot_interval_min}"></div>
      <div><label>Minimum notice (minutes)${tip("How far ahead customers must book online. With 60, they cannot pick a time that starts in the next hour. Does not apply when you add a booking in Admin.")}</label><input name="min_notice_min" type="number" min="0" value="${s.min_notice_min}"></div>
      <div><label>Booking window (days ahead)${tip("How far into the future customers can book online. With 30, they can book up to about a month ahead. Admin bookings can go further.")}</label><input name="max_days_ahead" type="number" min="1" max="365" value="${s.max_days_ahead}"></div>
      <div><label>Timezone${tip("Salon-local timezone used for open hours, slots, and booking times. Keep America/Los_Angeles for Rancho Cucamonga. Changing this incorrectly can shift appointment times.")}</label><input name="timezone" value="${esc(s.timezone)}"></div>
    </form>
    <p style="margin-top:1rem"><button class="btn" id="save">Save settings</button></p>`;

  // Tap ? to toggle; tap outside closes via the global listener below.
  app.querySelectorAll(".tip").forEach((el) => {
    el.querySelector("button").onclick = (e) => {
      e.preventDefault();
      e.stopPropagation();
      const open = el.classList.contains("is-open");
      closeAllTips();
      if (!open) el.classList.add("is-open");
    };
  });
  document.getElementById("save").onclick = async () => {
    const body = Object.fromEntries(new FormData(document.getElementById("sform")).entries());
    try {
      const res = await api("/api/admin/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      SETTINGS = res.settings;
      showMsg("Settings saved.");
    } catch (e) { showMsg(e.message, true); }
  };
}

/* ---------- boot ---------- */
function closeAllTips() {
  document.querySelectorAll(".tip.is-open").forEach((t) => {
    t.classList.remove("is-open");
    const btn = t.querySelector("button");
    if (btn) btn.blur();
  });
}
// Tap/click outside an open tip closes it (needed on phones — no hover).
document.addEventListener("pointerdown", (e) => {
  if (!document.querySelector(".tip.is-open")) return;
  if (e.target.closest(".tip")) return;
  closeAllTips();
}, true);

const views = {
  bookings: viewBookings,
  services: viewServices,
  staff: viewStaff,
  hours: viewHours,
  team: viewTeam,
  settings: viewSettings,
};
document.querySelectorAll(".tabs button").forEach((b) => {
  b.onclick = () => {
    closeAllTips();
    document.querySelectorAll(".tabs button").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    views[b.dataset.tab]().catch((e) => { app.innerHTML = `<p class="msg err">${esc(e.message)}</p>`; });
  };
});
Promise.all([api("/api/admin/settings"), api("/api/admin/me")])
  .then(([settingsData, me]) => {
    SETTINGS = settingsData.settings;
    const who = document.getElementById("whoami");
    if (who && me.user?.email) who.textContent = me.user.email;
    return viewBookings();
  })
  .catch((e) => {
    if (String(e.message || "").includes("401") || String(e.message || "").includes("Authentication")) {
      location.href = "/admin/login";
      return;
    }
    app.innerHTML = `<p class="msg err">${esc(e.message)}</p>`;
  });
</script>
</body>
</html>
